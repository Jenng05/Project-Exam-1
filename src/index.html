<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Us Bloggers</title>
    <meta
      name="description"
      content="A modern blog platform where users can read and manage blog posts."
    />

    <!-- CSS links-->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="./index.html" aria-label="Logo - Go to homepage"
          >Us Bloggers</a
        >

        <button class="menu-toggle" aria-label="Open menu">☰</button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Blog</a>
          <a href="#">Login</a>
          <a href="#">Register</a>
          <a href="#">Create Post</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <h2 class="page-title">Blog title name</h2>

      <!-- Carousel -->
      <section class="carousel" aria-label="Featured blog posts">
        <div class="carousel-track" id="carousel-track">
          <div class="carousel-slide">
            <img src="https://placehold.co/600x400" alt="Blog post image" />
            <div class="carousel-content">
              <div class="carousel-panel">
                <h3>Featured Blog Post</h3>
                <p>Short previewed text</p>
                <a class="carousel-link" href="#">Read More</a>
              </div>
            </div>
          </div>
        </div>

        <div class="carousel-control">
          <button
            type="button"
            class="carousel-btn"
            id="carousel-prev"
            aria-label="Previous post"
          >
            ‹
          </button>

          <div
            class="carousel-dots"
            id="carousel-dots"
            aria-label="Carousel pagination"
          >
            <!-- JS will inject dots here -->
            <button
              class="carousel-dot is-active"
              aria-label="Slide 1"
            ></button>
            <button class="carousel-dot" aria-label="Slide 2"></button>
            <button class="carousel-dot" aria-label="Slide 3"></button>
          </div>

          <button
            type="button"
            class="carousel-btn"
            id="carousel-next"
            aria-label="Read More"
          >
            ›
          </button>
        </div>
      </section>

      <!-- Posts grid -->
      <section class="post-grid" aria-label="Post feed">
        <div id="post-feed">
          <!-- JS will inject 12 posts here -->
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-brand">Us Bloggers</p>

        <div class="footer-links">
          <div>
            <p class="footer-heading">Pages</p>
            <a href="./index.html">Blog</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
          </div>

          <div>
            <p class="footer-heading">Account</p>
            <a href="./account/login.html">Login</a>
            <a href="./account/register.html">Register</a>
          </div>
        </div>

        <p class="footer-copy">© 2026 Us Bloggers</p>
      </div>
    </footer>
    <script src="/js/index.js"></script>
  </body>
</html>
