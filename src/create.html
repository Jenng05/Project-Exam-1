<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create post | Us Bloggers</title>
    <meta name="description" content="Create a new blog post." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="/index.html" aria-label="Go to homepage"
          >Us Bloggers</a
        >
        <button class="menu-toggle" type="button" aria-label="Open menu">
          ☰
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/index.html">Blog</a>
          <a href="/src/login.html" data-nav="login">Login</a>
          <a href="/src/register.html" data-nav="register">Register</a>
          <a href="/src/create.html" data-nav="create">Create Post</a>
          <a href="#" data-nav="logout" style="display: none">Logout</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <a class="back-link" href="/index.html">← Back to blog</a>
      <h1 class="page-heading">Create post</h1>

      <section class="form-card">
        <form class="form" id="create-post-form" novalidate>
          <div class="field">
            <label class="label" for="title">Title</label>
            <input
              class="input"
              id="title"
              name="title"
              type="text"
              placeholder="Write a title..."
            />
          </div>

          <div class="field">
            <label class="label" for="body">Body</label>
            <textarea
              class="textarea"
              id="body"
              name="body"
              rows="7"
              placeholder="Write a text..."
            ></textarea>
          </div>

          <div class="field">
            <label class="label" for="image">Image URL</label>
            <input
              class="input"
              id="image"
              name="image"
              type="url"
              placeholder="Paste an image..."
            />
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Create post</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-brand">Us Bloggers</p>

        <div class="footer-links">
          <div>
            <p class="footer-heading">Pages</p>
            <a href="/index.html">Blog</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
          </div>
          <div>
            <p class="footer-heading">Account</p>
            <a href="/src/login.html">Login</a>
            <a href="/src/register.html">Register</a>
          </div>
        </div>

        <p class="footer-copy">© 2026 Us Bloggers</p>
      </div>
    </footer>

    <script type="module" src="../js/api/post.js"></script>
    <script type="module">
      import { initNavGuard, requireAuth } from "../js/api/guard.js";
      initNavGuard();
      requireAuth();
    </script>
  </body>
</html>
