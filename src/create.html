<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create post | Us Bloggers</title>
    <meta name="description" content="Create a new blog post." />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="./index.html" aria-label="Go to homepage"
          >Us Bloggers</a
        >
        <button class="menu-toggle" type="button" aria-label="Open menu">
          ☰
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./login.html">Login</a>
          <a href="./register.html">Register</a>
          <a href="./create.html" aria-current="page">Create Post</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <a class="back-link" href="./index.html">← Back to blog</a>
      <h1 class="page-heading">Create post</h1>

      <section class="form-card">
        <form id="create-post-form" class="form" novalidate>
          <label class="field">
            <span class="field-label">Title</span>
            <input
              class="input"
              name="title"
              type="text"
              placeholder="Write a title..."
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Body</span>
            <textarea
              class="textarea"
              name="body"
              rows="7"
              placeholder="Write a text..."
              required
            ></textarea>
          </label>

          <label class="field">
            <span class="field-label">Image URL</span>
            <input
              class="input"
              name="image"
              type="url"
              placeholder="Paste an image..."
            />
          </label>

          <button class="btn" type="submit">Create post</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-brand">Us Bloggers</p>

        <div class="footer-links">
          <div>
            <p class="footer-heading">Pages</p>
            <a href="./index.html">Blog</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
          </div>
          <div>
            <p class="footer-heading">Account</p>
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>
          </div>
        </div>

        <p class="footer-copy">© 2026 Us Bloggers</p>
      </div>
    </footer>

    <script src="../js/post.js"></script>
  </body>
</html>
