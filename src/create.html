<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Us Bloggers</title>
    <meta
      name="description"
      content="A modern blog platform where users can read and manage blog posts."
    />

    <!-- CSS links-->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="./index.html" aria-label="Logo - Go to homepage"
          >Us Bloggers</a
        >

        <button class="menu-toggle" aria-label="Open menu">☰</button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Blog</a>
          <a href="#">Login</a>
          <a href="#">Register</a>
          <a href="#">Create Post</a>
        </nav>
      </div>
    </header>

    <main>
        <h2 class="page-title">Create a new blog post</h2>
    
        <form class="create-post-form" aria-label="Create a new blog post">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
    
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10" required></textarea>
    
            <button type="submit" class="btn">Create Post</button>
        </form>
    </main>
    </footer>
    <script src="/js/index.js"></script>
  </body>
</html>
