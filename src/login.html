<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Us Bloggers</title>
    <meta name="description" content="Log in to manage blog posts." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="/index.html" aria-label="Go to homepage"
          >Us Bloggers</a
        >

        <button class="menu-toggle" type="button" aria-label="Open menu">
          ☰
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="/index.html">Blog</a>
          <a href="/src/login.html" data-nav="login">Login</a>
          <a href="/src/register.html" data-nav="register">Register</a>
          <a href="/src/create.html" data-nav="create">Create Post</a>
          <a href="#" data-nav="logout" style="display: none">Logout</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <a class="back-link" href="/index.html">← Back to blog</a>

      <section class="card">
        <h1 class="page-title">Login</h1>

        <form class="form" id="login-form" novalidate>
          <label class="field">
            <span class="label">Email</span>
            <input
              id="email"
              class="input"
              type="email"
              name="email"
              placeholder="example@email.com..."
              required
            />
          </label>

          <label class="field">
            <span class="label">Password</span>
            <input
              id="password"
              class="input"
              type="password"
              name="password"
              placeholder="Enter your password..."
              required
            />
          </label>

          <button class="btn" type="submit">Log in</button>

          <p class="form-note">
            Don’t have an account?
            <a class="link" href="/src/register.html">Register here</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-brand">Us Bloggers</p>

        <div class="footer-links">
          <div>
            <p class="footer-heading">Pages</p>
            <a href="/index.html">Blog</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
          </div>

          <div>
            <p class="footer-heading">Account</p>
            <a href="/src/login.html">Login</a>
            <a href="/src/register.html">Register</a>
          </div>
        </div>

        <p class="footer-copy">© 2026 Us Bloggers</p>
      </div>
    </footer>

    <script type="module" src="/js/api/login.js"></script>
    <script type="module">
      import { initNavGuard } from "/js/api/guard.js";
      initNavGuard();
    </script>
  </body>
</html>
